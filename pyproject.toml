[project]
name = "altium-cruncher"
version = "2026.9.13.1"
description = "Cross-platform Altium CLI utilities built on public altium-monkey"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Wavenumber LLC" },
]
dependencies = [
    "altium-monkey==2026.9.13.post1",
    "colorama>=0.4.6",
    "easyeda-monkey>=2026.9.11",
    "json-with-comments>=1.2.10",
    "jsonschema>=4.0.0",
    "typing-extensions>=4.15.0",
    "openpyxl>=3.1.0",
    "rich>=13.7.0",
    "shapely>=2.1.1",
    "wn-geometer==2026.9.13",
]

[project.optional-dependencies]
easyeda = []
test = [
    # Test-only SVG pixel assertions for mask openings and substrate cutouts.
    "resvg-py>=0.5.0,<0.6",
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "wn-rack>=1.1.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[dependency-groups]
dev = [
    "resvg-py>=0.5.0,<0.6",
    "jsonschema>=4.0.0",
    "pytest>=8.0.0",
    "wn-rack>=1.1.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/wavenumber-eng/altium_cruncher"
Repository = "https://github.com/wavenumber-eng/altium_cruncher"
Issues = "https://github.com/wavenumber-eng/altium_cruncher/issues"

[project.scripts]
altium-cruncher = "altium_cruncher._cli:main"
acr = "altium_cruncher._cli:main"
ad = "altium_cruncher.altium_cruncher_cmd_launch:main_ad"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Slash-less patterns match at every depth (gitwildmatch), so root-level
# metadata files are anchored with a leading slash to keep files like
# tests/assets/**/README.md out of the sdist.
include = [
    "src/py/altium_cruncher/**",
    "src/tsp/altium_cruncher/**",
    "src/ts/altium_cruncher_config/**",
    "/package.json",
    "/package-lock.json",
    "/tspconfig.yaml",
    "/tsconfig.contracts.json",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "docs/**",
    "docs/contracts/**",
    "examples/**",
    "scripts/**",
    "/pyproject.toml",
]
exclude = [
    "docs/plans/**",
    "docs/research/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py/altium_cruncher"]

[tool.hatch.version]
path = "src/py/altium_cruncher/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/py"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: long-running tests",
    "easyeda: tests covering EasyEDA import fixtures",
]
